<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep Shot — Privacy Policy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Keep Shot</div>
    <select id="langSwitch" class="lang-switch" aria-label="Language"></select>
  </div>
  <div class="hero">
    <div class="logo">Keep Shot</div>
    <div class="tag" id="tag">Privacy Policy</div>
  </div>
  <div class="updated" id="updated"></div>
  <div class="card" id="content"></div>
  <div class="nav">
    <a id="navHome" href="index.html">Home</a>
    <a id="navSupport" href="support.html">Support</a>
  </div>
  <div class="footer">© 2026 Keep Shot. All rights reserved.</div>
</div>
<script src="i18n.js"></script>
<script src="site.js"></script>
<script>
window.renderPage = function (d) {
  document.title = 'Keep Shot — ' + d.privacy.title;
  document.getElementById('tag').textContent = d.privacy.title;
  document.getElementById('updated').textContent = d.privacy.updated;
  document.getElementById('navHome').textContent = d.nav.home;
  document.getElementById('navSupport').textContent = d.nav.support;
  var html = '';
  d.privacy.sections.forEach(function (s) { html += '<h2>' + s.h + '</h2><p>' + s.p + '</p>'; });
  html += '<p class="muted">' + d.privacy.contactNote + '</p>';
  document.getElementById('content').innerHTML = html;
};
</script>
</body>
</html>
