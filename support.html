<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep Shot — Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Keep Shot</div>
    <select id="langSwitch" class="lang-switch" aria-label="Language"></select>
  </div>
  <div class="hero">
    <div class="logo">Keep Shot</div>
    <div class="tag" id="tag">Support</div>
  </div>
  <div class="card" id="content"></div>
  <div class="nav">
    <a id="navHome" href="index.html">Home</a>
    <a id="navPrivacy" href="privacy.html">Privacy</a>
  </div>
  <div class="footer">© 2026 Keep Shot. All rights reserved.</div>
</div>
<script src="i18n.js"></script>
<script src="site.js"></script>
<script>
window.renderPage = function (d) {
  document.title = 'Keep Shot — ' + d.support.title;
  document.getElementById('tag').textContent = d.support.title;
  document.getElementById('navHome').textContent = d.nav.home;
  document.getElementById('navPrivacy').textContent = d.nav.privacy;
  var html = '<h2>' + d.nav.support + '</h2>';
  html += '<p>' + d.support.contact + '</p>';
  html += '<h2>FAQ</h2>';
  d.support.faqs.forEach(function (f) { html += '<h3>' + f.q + '</h3><p>' + f.a + '</p>'; });
  document.getElementById('content').innerHTML = html;
};
</script>
</body>
</html>
